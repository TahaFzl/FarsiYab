# FarsiYab source registry.
#
# Single source of truth for every source the project knows about. The backend
# loads this file into the `source` table; docs/sources/*.md hold the details.
#
# Field reference:
#   id                 stable id used in code and the database
#   name_fa / name_en  label shown to users under "sources"
#   kind               discovery   – finds new candidate businesses
#                      evidence    – adds proof for candidates found elsewhere
#                      link_only   – we only build outbound links, never fetch data
#                      reference   – auxiliary data (cities, geocoding), not shown as a source
#   access             open_dataset | open_api | public_pages | official_api | form
#   account_required   false for everything in the MVP (ADR-005)
#   license            licence of the data we store
#   storage            full | facts_only | ids_only | none
#   refresh            how often the adapter runs
#   status             mvp | planned | candidate | optional | rejected
#   phase              roadmap phase that implements it (docs/08-roadmap.md)
#   tested             true only if it was run against real data from this project
#   signals            detector signals this source can emit (docs/04-iranian-detection.md)
#   doc                documentation file

sources:
  # ── MVP: no account needed ────────────────────────────────────────────────
  - id: overture
    name_fa: Overture Maps
    name_en: Overture Maps
    kind: discovery
    access: open_dataset
    account_required: false
    license: CDLA-Permissive-2.0 / Apache-2.0 (Foursquare-derived rows)
    storage: full
    refresh: monthly (new release)
    status: mvp
    phase: 1
    tested: true            # Toronto, releases 2026-08-19.0 and 2026-09-23.1
    upstream: [meta, Microsoft, Foursquare, AllThePlaces, PinMeTo, DAC]
    signals: [overture_persian_category, persian_script_name, explicit_keyword, iranian_place_name]
    doc: docs/sources/overture-maps.md

  - id: osm
    name_fa: اوپن‌استریت‌مپ
    name_en: OpenStreetMap
    kind: discovery
    access: open_api
    account_required: false
    license: ODbL-1.0
    storage: full
    refresh: weekly
    status: mvp
    phase: 1
    tested: false           # overpass-api.de is blocked by the dev sandbox network policy
    signals: [osm_cuisine_tag, persian_script_name, explicit_keyword, iranian_place_name]
    doc: docs/sources/openstreetmap.md

