# MVP countries and cities (docs/06-categories-and-locations.md).
#
# bbox is [west, south, east, north] in WGS84 and deliberately covers the
# metro area, not just the city limits, because Iranian businesses cluster in
# suburbs (e.g. North York / Richmond Hill for Toronto, Westwood / Irvine for LA).
# wikivoyage lists the English Wikivoyage page(s); their district subpages are read too.
# regions are the states / provinces whose nonprofit registries are read (IRS, CRA, ACNC;
# "ENG" for the Charity Commission for England and Wales; French départements for SIRENE).
# Keep them quoted: unquoted YAML reads ON (Ontario) as the boolean true.
# Adding a city: append an entry here and run `farsiyab db load`.

countries:
  - code: US
    name_fa: آمریکا
    name_en: United States
  - code: CA
    name_fa: کانادا
    name_en: Canada
  - code: DE
    name_fa: آلمان
    name_en: Germany
  - code: GB
    name_fa: بریتانیا
    name_en: United Kingdom
  - code: SE
    name_fa: سوئد
    name_en: Sweden
  - code: NL
    name_fa: هلند
    name_en: Netherlands
  - code: FR
    name_fa: فرانسه
    name_en: France
  - code: AU
    name_fa: استرالیا
    name_en: Australia
  # Turkey and the UAE: Persian script, Iranian place names and Iranian visitors are
  # everywhere, so a single weak signal is not enough (docs/06). Only medium and high.
  - code: TR
    name_fa: ترکیه
    name_en: Turkey
    min_display_score: 0.45
  - code: AE
    name_fa: امارات
    name_en: United Arab Emirates
    min_display_score: 0.45

